<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>QuizPulse — ведущий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- только знак ﷺ (салляЛлаху алейхи ва саллям) из шрифта Amiri -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri&text=%EF%B7%BA&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c8ff3e'/%3E%3Cpath d='M2 12h4l2.5-6 4 13 3-9 1.5 2H22' fill='none' stroke='%2311160a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    body { min-height: 100vh; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: rgba(11, 16, 32, 0.6); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
    .topbar .title { font-weight: 800; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36vw; }
    .page { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 28px 24px 40px; }
    h1.h { font-family: var(--font-display); font-size: clamp(24px, 3vw, 34px); letter-spacing: -0.02em; margin: 0; }

    /* Library */
    .lib-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .quiz-card { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .quiz-card h3 { margin: 0; font-size: 19px; line-height: 1.25; }
    .quiz-card .meta { color: var(--muted); font-size: 14px; font-weight: 700; }
    .quiz-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
    .how { margin-top: 28px; padding: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .how .step b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); margin-bottom: 8px; }
    .how .step p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .empty { padding: 40px; text-align: center; }

    /* Editor */
    .ed { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
    .qlist { padding: 12px; display: grid; gap: 8px; position: sticky; top: 86px; max-height: calc(100vh - 110px); overflow: auto; }
    .qitem { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; background: rgba(255,255,255,0.03); text-align: left; width: 100%; }
    .qitem:hover { background: rgba(255,255,255,0.07); }
    .qitem.on { border-color: var(--accent); background: rgba(200,255,62,0.08); }
    .qitem.err { border-color: var(--bad); }
    .qitem .n { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; font-size: 13px; }
    .qitem .t { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .qitem .t.ph { color: var(--muted); font-style: italic; }
    .qpanel { padding: 22px; display: grid; gap: 18px; }
    .qtools { display: flex; gap: 8px; flex-wrap: wrap; }
    .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .ans-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ans-edit .ans { min-height: 72px; padding: 10px 12px; font-size: 16px; }
    .ans-edit .ans input { flex: 1; background: rgba(0,0,0,0.18); border: 0; border-radius: 10px; padding: 10px 12px; color: #fff; font-weight: 700; outline: none; min-width: 0; }
    .ans-edit .ans input::placeholder { color: rgba(255,255,255,0.6); }
    .ans-edit .ans input[readonly] { background: transparent; }
    .ok-toggle { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.75); background: transparent; color: transparent; cursor: pointer; font-size: 20px; font-weight: 900; display: grid; place-items: center; }
    .ok-toggle.on { background: #fff; color: var(--ok); border-color: #fff; }
    .img-prev { max-height: 160px; border-radius: 12px; }

    /* Game */
    .stage { flex: 1; display: flex; flex-direction: column; padding: 24px; gap: 20px; width: 100%; max-width: 1400px; margin: 0 auto; }
    .lobby-top { display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 26px 30px; align-items: center; }
    .join-steps { display: grid; gap: 10px; font-size: clamp(16px, 1.6vw, 22px); font-weight: 700; }
    .join-url { font-family: var(--font-display); color: var(--accent); font-size: clamp(18px, 2.2vw, 30px); word-break: break-all; }
    .pin-label { color: var(--muted); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px; margin-top: 10px; }
    .pin-big { font-family: var(--font-display); font-size: clamp(54px, 8vw, 112px); line-height: 1; letter-spacing: 0.06em; font-weight: 800; }
    .qr-box { background: #fff; border-radius: 22px; padding: 14px; width: clamp(200px, 22vw, 300px); aspect-ratio: 1; box-shadow: 0 0 0 8px rgba(200,255,62,0.25); }
    .qr-box img { width: 100%; height: 100%; display: block; }
    .lobby-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .count { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 26px; }
    .pill .ico { width: 16px; height: 16px; }
    .btn-icon .ico { width: 18px; height: 18px; }
    .players { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; min-height: 120px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-size: 18px; cursor: pointer; animation: bounceIn 0.45s cubic-bezier(.2,1.4,.4,1) both; }
    .chip:hover { background: var(--bad); text-decoration: line-through; }
    .chip.off { opacity: 0.45; }
    .chip .avatar { font-size: 15px; }
    .waiting { color: var(--muted); font-size: 20px; font-weight: 700; padding: 30px 0; width: 100%; text-align: center; }

    .qcard { background: #fff; color: #0d1321; border-radius: 20px; padding: 22px 28px; text-align: center; font-weight: 800; font-size: clamp(22px, 3vw, 42px); line-height: 1.2; box-shadow: var(--shadow); }
    .qmid { flex: 1; display: grid; grid-template-columns: 160px 1fr 160px; align-items: center; gap: 20px; min-height: 180px; }
    .qmid .side { display: grid; justify-items: center; gap: 6px; }
    .qmid .img { display: grid; place-items: center; }
    .qmid .img img { max-height: 34vh; border-radius: 18px; box-shadow: var(--shadow); }
    .answered { font-family: var(--font-display); font-size: 48px; line-height: 1; }
    .stage .answers .ans { min-height: clamp(80px, 12vh, 130px); }
    .preview { flex: 1; display: grid; place-items: center; text-align: center; }
    .preview .qtext { font-family: var(--font-display); font-size: clamp(28px, 4.4vw, 64px); line-height: 1.15; max-width: 1100px; margin: 20px auto 30px; letter-spacing: -0.02em; }

    .chart { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(80px, 160px); justify-content: center; align-items: end; gap: 24px; min-height: 220px; padding-top: 10px; }
    .col { display: grid; justify-items: center; gap: 8px; height: 100%; grid-template-rows: auto 1fr auto; }
    .col .cnt { font-family: var(--font-display); font-size: 30px; display: flex; align-items: center; gap: 6px; }
    .col .well { width: 100%; display: flex; align-items: flex-end; }
    .col .fill { width: 100%; border-radius: 14px 14px 6px 6px; min-height: 10px; transform-origin: bottom; animation: grow 0.8s cubic-bezier(.2,.8,.2,1) both; }
    .col .lt { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); color: #fff; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    .lb { width: 100%; max-width: 860px; margin: 0 auto; display: grid; gap: 12px; }
    .lb-row { display: grid; grid-template-columns: 56px 48px 1fr auto auto; align-items: center; gap: 14px; padding: 16px 22px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); font-size: clamp(18px, 2vw, 26px); font-weight: 800; animation: fadeIn 0.4s ease both; }
    .lb-row:nth-child(1) { background: linear-gradient(90deg, rgba(200,255,62,0.25), var(--surface)); border-color: rgba(200,255,62,0.5); }
    .lb-row .rk { font-family: var(--font-display); color: var(--muted); }
    .lb-row .av { font-size: clamp(15px, 1.6vw, 20px); }
    .lb-row .plus { color: var(--ok); font-size: 0.8em; }
    .lb-row .sc { font-family: var(--font-display); min-width: 120px; text-align: right; }
    .move { font-size: 14px; margin-left: 8px; }
    .move.up { color: var(--ok); } .move.down { color: var(--bad); }

    .podium { position: relative; overflow: hidden; flex: 1; display: flex; justify-content: center; align-items: flex-end; gap: 18px; min-height: 380px; padding-top: 30px; }
    .pod { position: relative; z-index: 1; width: clamp(140px, 18vw, 230px); display: grid; justify-items: center; gap: 10px; text-align: center; }
    .pod .av { font-size: clamp(24px, 3vw, 36px); }
    .pod .nm { font-weight: 800; font-size: clamp(16px, 1.8vw, 24px); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pod .block { width: 100%; border-radius: 18px 18px 0 0; display: grid; align-content: start; justify-items: center; padding-top: 16px; gap: 6px; transform-origin: bottom; transform: scaleY(0); transition: transform 0.9s cubic-bezier(.2,.9,.25,1.15); }
    .pod .place { font-family: var(--font-display); font-size: clamp(36px, 5vw, 64px); color: rgba(0,0,0,0.55); }
    .pod .pts { font-weight: 800; color: rgba(0,0,0,0.65); }
    .pod.p1 .block { height: 260px; background: linear-gradient(180deg, #e3ff8f, var(--accent)); }
    .pod.p2 .block { height: 190px; background: linear-gradient(180deg, #e6e9f2, #b9c0d4); }
    .pod.p3 .block { height: 140px; background: linear-gradient(180deg, #ffc896, #e28a47); }
    .pod .who { opacity: 0; transform: translateY(24px) scale(0.7); transition: opacity 0.4s ease 0.45s, transform 0.6s cubic-bezier(.2,1.5,.4,1) 0.45s; }
    /* во время дроби — дрожащая «заготовка» постамента */
    .pod.rolling .block { transform: scaleY(0.07); animation: drum 0.09s linear infinite alternate; transition: transform 0.3s; }
    @keyframes drum { from { translate: -2px 0; } to { translate: 2px 0; } }
    .pod.shown .block { transform: scaleY(1); animation: none; }
    .pod.shown .who { opacity: 1; transform: none; }
    .pod.instant .block, .pod.instant .who { transition: none; }
    .pod.p1.shown .block { box-shadow: 0 0 70px rgba(200, 255, 62, 0.45); }
    .rays { position: absolute; z-index: 0; left: 50%; bottom: 60px; width: 900px; height: 900px; margin-left: -450px; margin-bottom: -350px; border-radius: 50%; opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
      background: repeating-conic-gradient(rgba(200, 255, 62, 0.16) 0 9deg, transparent 9deg 22deg); -webkit-mask: radial-gradient(circle, #000 18%, transparent 62%); mask: radial-gradient(circle, #000 18%, transparent 62%); animation: spin 26s linear infinite; }
    .rays.on { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .announce { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3vw, 40px); min-height: 1.4em; color: var(--text); letter-spacing: -0.01em; }
    .announce.rolling { color: var(--muted); animation: pulse 0.5s ease-in-out infinite alternate; }
    .announce.win { color: var(--accent); animation: bounceIn 0.6s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes pulse { from { opacity: 0.45; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }
    .later { opacity: 0; pointer-events: none; transition: opacity 0.6s; }
    .preview .qtext.with-img { font-size: clamp(24px, 3.2vw, 46px); margin: 14px auto 16px; }
    .pv-img { display: block; max-height: 38vh; max-width: min(100%, 720px); margin: 0 auto 22px; border-radius: 20px; box-shadow: var(--shadow); }
    .modal.wide { width: min(860px, 100%); max-height: 90vh; overflow: auto; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .gallery button { padding: 0; border: 2px solid transparent; border-radius: 14px; overflow: hidden; background: var(--surface-2); cursor: pointer; text-align: left; color: var(--text); }
    .gallery button:hover, .gallery button:focus-visible { border-color: var(--accent); }
    .gallery img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .gallery span { display: block; padding: 8px 10px; font-size: 13px; font-weight: 700; }
    .who { display: grid; justify-items: center; gap: 6px; max-width: 100%; }
    table.res { width: 100%; border-collapse: collapse; font-size: 15px; }
    table.res th, table.res td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
    table.res th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }

    .controls { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

    @media (max-width: 900px) {
      .ed { grid-template-columns: 1fr; }
      .qlist { position: static; max-height: none; }
      .lobby-top { grid-template-columns: 1fr; justify-items: center; text-align: center; }
      .qmid { grid-template-columns: 1fr 1fr; }
      .qmid .img { grid-column: 1 / -1; grid-row: 1; }
      .how { grid-template-columns: 1fr; }
      .opts { grid-template-columns: 1fr; }
      .ans-edit { grid-template-columns: 1fr; }
      .topbar { padding: 12px 16px; }
      .page { padding: 20px 16px 32px; }
      .stage { padding: 16px; }
      .lb-row { grid-template-columns: 36px 36px 1fr auto; padding: 12px 14px; }
      .lb-row .plus { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar" id="topbar">
      <a class="brand" href="/host" id="brandLink"><span class="brand-mark" id="brandMark"></span><span class="brand-name">QuizPulse</span></a>
      <span class="title" id="topTitle"></span>
      <span class="spacer"></span>
      <div class="row" id="topActions" style="gap:8px;flex-wrap:wrap"></div>
      <div id="langSw"></div>
    </header>
    <main id="view" style="flex:1;display:flex;flex-direction:column"></main>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/sounds.js"></script>
  <script src="/host.js"></script>
</body>
</html>
