<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>QuizPulse — войти в игру</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- только знак ﷺ (салляЛлаху алейхи ва саллям) из шрифта Amiri -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri&text=%EF%B7%BA&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c8ff3e'/%3E%3Cpath d='M2 12h4l2.5-6 4 13 3-9 1.5 2H22' fill='none' stroke='%2311160a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    body { min-height: 100dvh; }
    .shell { min-height: 100dvh; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 8px 16px 16px; width: 100%; max-width: 560px; margin: 0 auto; }
    .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
    .join-card { width: 100%; padding: 26px 22px; display: grid; gap: 14px; }
    .join-card h1 { margin: 0; font-family: var(--font-display); font-size: 24px; letter-spacing: -0.02em; }
    .pin-input { text-align: center; font-family: var(--font-display); font-size: 34px; letter-spacing: 0.2em; padding: 16px; }
    .avatar.xl { font-size: 34px; }
    .sound-btn { margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 10px; width: 38px; height: 34px; display: grid; place-items: center; cursor: pointer; }
    .sound-btn .ico { width: 18px; height: 18px; }
    .title-xl { font-family: var(--font-display); font-size: 28px; margin: 0; letter-spacing: -0.02em; }
    .qtext { font-size: 20px; font-weight: 800; line-height: 1.3; margin: 6px 0 14px; text-align: center; }
    .qimg { max-height: 26vh; border-radius: 14px; margin: 0 auto 12px; display: block; }
    .p-answers { flex: 1; display: grid; gap: 10px; grid-template-columns: 1fr 1fr; align-content: stretch; }
    .p-answers.list { grid-template-columns: 1fr; }
    .p-answers .ans { min-height: 76px; font-size: 18px; cursor: pointer; }
    .p-answers.only-letters .ans { justify-content: center; min-height: 26vh; }
    .p-answers.only-letters .ans .letter { width: 2.6em; height: 2.6em; font-size: 1.6em; background: rgba(255,255,255,0.25); }
    .p-answers .ans:active { transform: scale(0.97); }
    .qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .qhead .bar { flex: 1; }
    .qhead .sec { font-family: var(--font-display); font-weight: 700; width: 2.2em; text-align: right; }
    .result { border-radius: 26px; padding: 36px 20px; width: 100%; }
    .result.ok { background: linear-gradient(160deg, #23c06f, #11864b); }
    .result.bad { background: linear-gradient(160deg, #ff5a5f, #b8323f); }
    .result.none { background: linear-gradient(160deg, #4c5a85, #2b3557); }
    .result .icon { line-height: 1; display: grid; place-items: center; }
    .result .icon .ico { width: 64px; height: 64px; stroke-width: 2.6; }
    .result .ico { vertical-align: -0.15em; }
    .result .pts { display: inline-block; margin-top: 10px; background: rgba(0,0,0,0.22); padding: 8px 16px; border-radius: 12px; font-family: var(--font-display); font-size: 22px; }
    .footer { display: flex; align-items: center; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(0,0,0,0.25); border-top: 1px solid var(--line); }
    .footer .name { font-weight: 800; }
    .footer .score { font-family: var(--font-display); background: var(--accent); color: var(--accent-ink); padding: 6px 12px; border-radius: 10px; }
    .dots span { display: inline-block; width: 10px; height: 10px; margin: 0 4px; border-radius: 50%; background: var(--accent); animation: dot 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: 0.15s; } .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    .chosen { width: 100%; max-width: 320px; }
    .drum-wait { display: flex; gap: 10px; align-items: flex-end; height: 70px; }
    .drum-wait span { width: 16px; border-radius: 8px; background: var(--accent); animation: beat 0.35s ease-in-out infinite alternate; }
    .drum-wait span:nth-child(1) { height: 40px; } .drum-wait span:nth-child(2) { height: 64px; animation-delay: 0.12s; } .drum-wait span:nth-child(3) { height: 48px; animation-delay: 0.24s; }
    @keyframes beat { from { transform: scaleY(0.4); opacity: 0.6; } to { transform: scaleY(1); opacity: 1; } }
    .host-link { font-size: 14px; color: var(--muted); }
    .host-link a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <a class="brand" href="/"><span class="brand-mark" id="brandMark"></span><span class="brand-name">QuizPulse</span></a>
      <span class="pill" id="pinPill" hidden></span>
    </div>
    <div class="main" id="app"></div>
    <div class="footer" id="footer" hidden></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/sounds.js"></script>
  <script src="/play.js"></script>
</body>
</html>
